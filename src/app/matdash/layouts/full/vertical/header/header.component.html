<mat-toolbar class="topbar gap-4">
  <!-- Left group: hamburger toggles + date -->
  <div class="left-group d-flex align-items-center gap-2 m-l-16">
    <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-lg-none">
      <i class="iconify" data-icon="solar:hamburger-menu-line-duotone"></i>
    </button>
    <button mat-icon-button (click)="toggleCollapsed.emit()" class="d-none d-lg-flex">
      <i class="iconify" data-icon="solar:hamburger-menu-line-duotone"></i>
    </button>
    <span class="date-text text-muted">{{ currentDate | date: "EEEE d 'de' MMMM y" }}</span>
  </div>

  <span class="flex-1-auto"></span>

  <!-- Right group: bell, language flag, avatar -->
  <div class="right-group d-flex align-items-center gap-3">

    <!-- Notification bell -->
    <button mat-icon-button [matMenuTriggerFor]="notificationmenu">
      <i class="iconify icon-20" data-icon="solar:bell-line-duotone"></i>
    </button>
    <mat-menu #notificationmenu="matMenu" class="topbar-dd cardWithShadow">
      <div class="p-x32 p-y16 text-center text-muted">
        {{ 'header.noNotifications' | transloco }}
      </div>
    </mat-menu>

    <!-- Language selector (flag image) -->
    <button mat-icon-button [matMenuTriggerFor]="flags">
      <img [src]="selectedLanguage().icon" class="rounded-circle object-cover icon-20" alt="lang" />
    </button>
    <mat-menu #flags="matMenu" class="cardWithShadow">
      @for (lang of languages; track lang.code) {
        <button mat-menu-item (click)="changeLang(lang)">
          <img [src]="lang.icon" class="rounded-circle object-cover icon-20 me-2" [alt]="lang.language" />
          <span>{{ lang.language }}</span>
        </button>
      }
    </mat-menu>

    <!-- Avatar / profile -->
    <button mat-button [matMenuTriggerFor]="profilemenu" class="profile-btn d-none d-lg-flex">
      <img src="/images/profile/user-1.jpg" class="rounded-circle icon-35 profile-dd" alt="profile" />
      <i data-icon="solar:alt-arrow-down-bold" class="iconify f-s-8"></i>
    </button>
    <mat-menu #profilemenu="matMenu" class="topbar-dd cardWithShadow">
      <div class="profile-card-header" (click)="$event.stopPropagation()">
        <p class="profile-display-name">{{ displayName() }}</p>
        <p class="profile-company">{{ companyName() }}</p>
      </div>
      <mat-divider />
      <button mat-menu-item class="profile-logout-btn" (click)="logout()">
        {{ 'header.logout' | transloco }}
      </button>
      <mat-divider />
      <p class="header-version-label mb-0">
        {{ 'header.version' | transloco }}: {{ appVersion }}
      </p>
    </mat-menu>

  </div>
</mat-toolbar>
