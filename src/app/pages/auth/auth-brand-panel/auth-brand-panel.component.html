<div class="left-panel" *transloco="let t; scope: 'auth'; read: 'auth'">
  <div class="brand">
    <div class="brand-logo">
      <span class="logo-icon">⚕</span>
      <span class="logo-text">SOFIA</span>
    </div>
  </div>

  <div class="panel-body">
    <p class="panel-title">{{ t('panelTitle') }}</p>
    <p class="panel-sub">{{ t('system') }}</p>
    <ul class="features">
      <li class="feature-item">
        <span class="feature-icon">💊</span>
        <span>{{ t('features.inventory') }}</span>
      </li>
      <li class="feature-item">
        <span class="feature-icon">📋</span>
        <span>{{ t('features.patients') }}</span>
      </li>
      <li class="feature-item">
        <span class="feature-icon">📊</span>
        <span>{{ t('features.digemid') }}</span>
      </li>
      <li class="feature-item">
        <span class="feature-icon">🔐</span>
        <span>{{ t('features.security') }}</span>
      </li>
    </ul>
  </div>

  <div class="panel-footer">© {{ currentYear }} SOFIA · v{{ appVersion }}</div>
</div>
