<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p style="white-space: pre-line; margin: 0">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="onClose()">
    {{ data.buttonText || ('actions.close' | transloco) }}
  </button>
</mat-dialog-actions>
