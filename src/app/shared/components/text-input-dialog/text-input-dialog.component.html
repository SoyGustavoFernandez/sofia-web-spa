<h2 mat-dialog-title>
  {{ data.title }}
</h2>
<mat-dialog-content>
  <span>
    {{ data.message }}
  </span>
  <form [formGroup]="form">
    <div class="row m-t-16">
      <div class="col-sm-12">
        <mat-form-field appearance="outline" class="w-100">
          <textarea
            matInput
            rows="4"
            maxlength="500"
            placeholder="{{ data.placeholder }}"
            formControlName="text"></textarea>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-flat-button
    class="bg-error text-white m-l-8"
    type="button"
    (click)="close()">
    {{ 'actions.cancel' | transloco }}
  </button>

  <button
    mat-flat-button
    type="button"
    class="text-white m-l-8"
    (click)="save()">
    {{ 'actions.save' | transloco }}
  </button>
</mat-dialog-actions>
