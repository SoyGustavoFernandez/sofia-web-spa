<mat-form-field appearance="outline" class="w-100">
  <input
    matInput
    [placeholder]="placeholder | transloco"
    [matAutocomplete]="auto"
    [disabled]="disabled"
    [(ngModel)]="searchValue"
    [attr.maxlength]="maxlength ? maxlength : null"
    (input)="onSearchInput($event)"
    (blur)="onBlur()"
    autocomplete="off" />

  <div
    *ngIf="multiple && selectedItems.length > 0"
    class="selected-items-container">
    <mat-chip-set>
      <mat-chip
        *ngFor="let item of selectedItems"
        [removable]="true"
        (removed)="removeSelectedItem(item)">
        {{ displayValue(item) }}
        <mat-icon *ngIf="!disabled" matChipRemove>cancel</mat-icon>
      </mat-chip>
    </mat-chip-set>
  </div>

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayValue"
    (optionSelected)="!multiple ? toggleSelection($event.option.value) : null">
    <mat-option
      *ngFor="let item of itemList"
      [value]="item"
      (mousedown)="$event.preventDefault()"
      (click)="multiple ? toggleSelection(item) : null"
      (keydown.enter)="multiple ? toggleSelection(item) : null">
      <mat-checkbox
        *ngIf="multiple"
        [checked]="isSelected(item)"
        [disabled]="disabled"
        style="pointer-events: none;">
      </mat-checkbox>

      <span [class.ml-2]="multiple">{{ displayValue(item) }}</span>
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
