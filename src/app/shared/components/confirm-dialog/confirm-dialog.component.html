<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="pre-line">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ cancelButtonText }}</button>
  <button mat-flat-button color="primary" (click)="onConfirm()">
    {{ confirmButtonText }}
  </button>
</mat-dialog-actions>
